name: build-windows

on:
  push:
    branches: [ '**' ]      # build every branch: the artifact is how the exe
    tags:     [ 'v*' ]      # gets tested, so waiting for a merge is too late
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set working directory
        run: echo "the C project lives in windows/"

      - name: Fetch 3proxy
        shell: pwsh
        working-directory: windows
        run: ./tools/fetch-3proxy.ps1 -Version 1.0.0 -Arch x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        working-directory: windows
        run: build.bat

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item windows\build\modlink.exe dist\
          Copy-Item windows\THIRD-PARTY.txt   dist\
          Copy-Item windows\README.md         dist\
          Copy-Item windows\res\3proxy.version.txt dist\ -ErrorAction SilentlyContinue

      # This is the whole point of the CI: download modlink.exe from here,
      # no compiler needed on your machine.
      - uses: actions/upload-artifact@v4
        with:
          name: modlink-windows-x64
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
