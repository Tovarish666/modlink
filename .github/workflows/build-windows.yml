name: build-windows

on:
  push:
    branches: [ '**' ]      # build every branch: the artifact is how the exe
    tags:     [ 'v*' ]      # gets tested, so waiting for a merge is too late
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch 3proxy
        shell: pwsh
        run: ./tools/fetch-3proxy.ps1 -Version 1.0.0 -Arch x64

      - uses: nuget/setup-nuget@v2

      - name: Restore WebView2 SDK header
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          "WEBVIEW2_INCLUDE=$PWD\packages\Microsoft.Web.WebView2\build\native\include" `
            | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: build.bat

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/proxyveth.exe      dist/
          Copy-Item THIRD-PARTY.txt          dist/
          Copy-Item README.md                dist/
          Copy-Item res/3proxy.version.txt   dist/ -ErrorAction SilentlyContinue

      # The point of this workflow: download proxyveth.exe from here, so no
      # compiler is ever needed on a development machine.
      - uses: actions/upload-artifact@v4
        with:
          name: proxyveth-windows-x64
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
